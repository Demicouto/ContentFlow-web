services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./back-end/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migration:
    build:
      context: ./back-end
      dockerfile: Dockerfile
      target: builder
    env_file:
      - ./back-end/.env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
      target: runner
    env_file:
      - ./back-end/.env
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
